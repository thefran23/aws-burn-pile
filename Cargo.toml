[package]
name = "aws-burn-pile"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8.22"
serde = { version = "1.0.229", features = ["derive"] }

# Browser (hydrate) only
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# Server (ssr) only
axum = { version = "0.8", optional = true }
leptos_axum = { version = "0.8.10", optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }
anyhow = { version = "1.0.104", optional = true }
aws-config = { version = "1.13.0", features = ["behavior-version-latest"], optional = true }
aws-sdk-costexplorer = { version = "1.137.0", optional = true }
chrono = { version = "0.4.45", optional = true }
toml = { version = "1.1.8", optional = true }
aws-sdk-sts = { version = "1.123.0", optional = true }
aws-sdk-budgets = { version = "1.129.0", optional = true }
aws-sdk-freetier = { version = "1.116.0", optional = true }
aws-sdk-invoicing = { version = "1.75.0", optional = true }
turf = "0.10"
js-sys = "0.3"
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"], optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
    "leptos/ssr",
    "dep:axum",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:anyhow",
    "dep:aws-config",
    "dep:aws-sdk-costexplorer",
    "dep:aws-sdk-sts",
    "dep:aws-sdk-budgets",
    "dep:aws-sdk-freetier",
    "dep:aws-sdk-invoicing",
    "dep:chrono",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "aws-burn-pile"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
